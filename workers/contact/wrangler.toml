name = "contact"
main = "src/index.js"
compatibility_date = "2026-08-17"

# Approximate limits per Cloudflare location, not a worldwide email quota.
[[ratelimits]]
name = "CONTACT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "CONTACT_TOTAL_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# The form on younes.aboudrar.dev is allowed to call this worker.
[vars]
CONTACT_TO = "younes@aboudrar.dev"
CONTACT_FROM = "contact@aboudrar.dev"
CONTACT_REPLY_PREFIX = "contact -"

# Runtime secrets: set via `wrangler secret put RESEND_API_KEY`
# [secrets]
# RESEND_API_KEY = "..."

[[routes]]
pattern = "contact.aboudrar.dev/*"
zone_name = "aboudrar.dev"

# Local-only profile; production keeps the single production origin.
[env.development]
routes = []
[env.development.vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
CONTACT_TO = "younes@aboudrar.dev"
CONTACT_FROM = "contact@aboudrar.dev"
CONTACT_REPLY_PREFIX = "contact -"
[[env.development.ratelimits]]
name = "CONTACT_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 5, period = 60 }
[[env.development.ratelimits]]
name = "CONTACT_TOTAL_LIMITER"
namespace_id = "1004"
simple = { limit = 20, period = 60 }
